name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  verify:
    name: Lint, Typecheck, Build, Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

# Deployment is handled by the Cloud Build trigger configured directly in the
# GCP Console (Cloud Run -> thehillsideoasis-web -> Triggers), which watches
# `main` and builds/deploys on every push using this repo's Dockerfile. That
# path uses Cloud Build's native GitHub connection, not this workflow, so no
# GCP credentials are needed here.
